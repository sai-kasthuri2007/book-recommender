<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Recommender</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .search-box {
            margin: 30px auto;
            width: 500px;
            max-width: 90%;
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #suggestions {
            background: white;
            border: 1px solid #ddd;
            text-align: left;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .suggestion {
            padding: 10px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #f0f0f0;
        }

        #recommendations {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .card img {
            width: 150px;
            height: 200px;
            object-fit: cover;
        }

        .card h3 {
            font-size: 17px;
        }

        .card p {
            color: #666;
        }
    </style>
</head>

<body>

    <h1>Book Recommender System</h1>

    <div class="search-box">

        <input
            type="text"
            id="bookName"
            placeholder="Enter a book name"
            autocomplete="off"
        >

        <div id="suggestions"></div>

        <button onclick="recommendBooks()">
            Recommend
        </button>

    </div>

    <div id="recommendations"></div>

    <script>

        let books = [];

        // Get all book titles
        fetch('/books')
            .then(response => response.json())
            .then(data => {
                books = data;
            });

        const input = document.getElementById('bookName');
        const suggestions = document.getElementById('suggestions');

        // Autocomplete
        input.addEventListener('input', function () {

            const text = input.value.toLowerCase();

            suggestions.innerHTML = '';

            if (text.length === 0) {
                return;
            }

            const matches = books
                .filter(book => book.toLowerCase().includes(text))
                .slice(0, 8);

            matches.forEach(book => {

                const div = document.createElement('div');

                div.className = 'suggestion';
                div.textContent = book;

                div.onclick = function () {
                    input.value = book;
                    suggestions.innerHTML = '';
                };

                suggestions.appendChild(div);
            });
        });


        // Get recommendations
        function recommendBooks() {

            const bookName = input.value;

            if (!bookName) {
                alert("Please enter a book name.");
                return;
            }

            fetch('/recommend', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    book_name: bookName
                })

            })

            .then(response => response.json())

            .then(data => {

                const container =
                    document.getElementById('recommendations');

                container.innerHTML = '';

                if (data.error) {
                    container.innerHTML =
                        `<p>${data.error}</p>`;
                    return;
                }

                data.forEach(book => {

                    const card =
                        document.createElement('div');

                    card.className = 'card';

                    card.innerHTML = `
                        <h3>${book.title}</h3>
                        <p>${book.author}</p>
                    `;

                    container.appendChild(card);
                });

            })

            .catch(error => {

                console.error(error);

                document.getElementById('recommendations').innerHTML =
                    '<p>Something went wrong. Please try again.</p>';

            });
        }

    </script>

</body>
</html>
